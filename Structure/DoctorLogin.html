<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Login</title>
    <link rel="stylesheet" href="DoctorLogin.css">
    <script src="docdata.js" defer></script>
</head>
<body>
    <div class="login-container">
        <img src="6505657.png" alt="Profile Image" class="profile-image">
        <h1>Welcome, You're a Doctor!</h1>
        <input type="text" id="un" placeholder="Username" required><br>
        <input type="password" id="pwd" placeholder="Password" required><br>
        <h4>New user?</h4>
        <a href="Signup.html">Sign up</a>
        <button onclick="login()">Submit</button>
        <p id="error-message" style="color: red; display: none;">Invalid username or password</p>
    </div>
    
</body>
</html>
