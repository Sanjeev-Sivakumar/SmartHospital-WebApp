<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List with Calendar & Time</title>

    <style>
        /* Internal CSS */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: black;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            text-align: center;
        }

        .header {
            margin-bottom: 30px;
            font-size: 18px;
            color: #ff3333;
            animation: glow 1.5s ease-in-out infinite alternate;
        }

        .header .time, .header .calendar {
            font-size: 18px;
            margin-bottom: 5px;
        }

        .container {
            background-color: red;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            width: 320px;
            animation: glow 1.5s ease-in-out infinite alternate;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }

        .input-area {
            display: flex;
            margin-bottom: 20px;
        }

        #task-input {
            flex: 1;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: black;
            color: white;
        }

        #add-btn {
            padding: 10px;
            background-color: red;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 0 5px 2px rgba(255, 0, 0, 0.8);
        }

        #add-btn:hover {
            background-color: #ff3333;
            box-shadow: 0 0 15px 5px rgba(255, 0, 0, 1);
        }

        ul {
            list-style-type: none;
            padding: 0;
        }

        li {
            padding: 10px;
            background-color: #333;
            border: 1px solid #555;
            margin-bottom: 10px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: glow 1.5s ease-in-out infinite alternate;
        }

        li.completed {
            text-decoration: line-through;
            background-color: #666;
        }

        button {
            background-color: #f44336;
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            padding: 5px;
            font-size: 14px;
            box-shadow: 0 0 10px 3px rgba(255, 0, 0, 0.8);
        }

        button:hover {
            background-color: #e53935;
            box-shadow: 0 0 15px 5px rgba(255, 0, 0, 1);
        }

        /* Animation for glowing effect */
        @keyframes glow {
            0% {
                box-shadow: 0 0 10px 2px rgba(255, 0, 0, 0.6);
            }
            100% {
                box-shadow: 0 0 20px 5px rgba(255, 0, 0, 1);
            }
        }

    </style>
</head>
<body>
    <!-- Header with Calendar and Time -->
    <div class="header">
        <div class="calendar" id="calendar"></div>
        <div class="time" id="date-time"></div>
    </div>

    <!-- To-Do List Container -->
    <div class="container">
        <h1>My To-Do List</h1>
        
        <div class="input-area">
            <input type="text" id="task-input" placeholder="Enter a new task..." />
            <button id="add-btn">Add Task</button>
        </div>
        
        <ul id="task-list">
            <!-- Tasks will be added here dynamically -->
        </ul>
    </div>

    <script>
        // Internal JavaScript

        // Get DOM elements
        const addButton = document.getElementById('add-btn');
        const taskInput = document.getElementById('task-input');
        const taskList = document.getElementById('task-list');
        const dateTimeElement = document.getElementById('date-time');
        const calendarElement = document.getElementById('calendar');

        // Function to update current date and time
        function updateDateTime() {
            const now = new Date();
            const date = now.toLocaleDateString();
            const time = now.toLocaleTimeString();
            dateTimeElement.textContent = `Current Time: ${time}`;
        }

        // Function to update calendar (current month and year)
        function updateCalendar() {
            const now = new Date();
            const month = now.toLocaleString('default', { month: 'long' });
            const year = now.getFullYear();
            calendarElement.textContent = `${month} ${year}`;
        }

        // Update time every second
        setInterval(updateDateTime, 1000);

        // Update calendar
        updateCalendar();

        // Function to add a new task
        function addTask() {
            const taskText = taskInput.value.trim();

            if (taskText === '') {
                return; // Don't add empty tasks
            }

            // Create a new list item
            const newTask = document.createElement('li');

            // Add task text
            newTask.innerHTML = `
                ${taskText}
                <button onclick="removeTask(this)">X</button>
            `;

            // Add click event for marking the task as completed
            newTask.addEventListener('click', function() {
                newTask.classList.toggle('completed');
            });

            // Append the task to the task list
            taskList.appendChild(newTask);

            // Clear the input field
            taskInput.value = '';
        }

        // Function to remove a task
        function removeTask(button) {
            const task = button.parentElement;
            taskList.removeChild(task);
        }

        // Event listener for the Add Task button
        addButton.addEventListener('click', addTask);

        // Event listener for Enter key to add task
        taskInput.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                addTask();
            }
        });
    </script>
</body>
</html>
